name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
env:
  NODE_VERSION: 22
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify Node & npm
        run: |
          node -v
          npm -v
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Build
        run: npm run build
      - name: Verify dist
        run: |
          test -d dist || { echo 'dist not generated'; exit 1; }
          test -f dist/index.html || { echo 'dist/index.html missing'; exit 1; }
          ls -la dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify Node & npm
        run: |
          node -v
          npm -v
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Build
        run: npm run build
      - name: Push dist to master
        run: |
          git config user.email 'github-actions[bot]'
          git config user.name 'github-actions'
          git checkout --orphan temp-pages
          git rm -rf .
          git clean -fdx
          cp -r dist/. .
          git add .
          git commit -m 'deploy: auto build from commit'
          git branch -M master
          git push -f origin master
